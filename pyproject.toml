[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerchip-research"
version = "6.0.0"
description = "영상 관측과 Farkas/IFR 예측을 분리한 연구용 포커칩 도구"
requires-python = ">=3.12,<3.15"
dependencies = ["numpy", "scipy", "opencv-contrib-python", "av", "PySide6", "matplotlib", "openpyxl", "psutil"]

[project.scripts]
pokerchip = "pokerchip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pokerchip.ui" = ["resources/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
